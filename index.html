<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Harita Arşivi</title>
    <style>
        /* --- GENEL VE DARK TEMA AYARLARI --- */
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --pubg-yellow: #f2a900;
        }

        body {
            margin: 0; 
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            user-select: none;
        }

        /* --- ANA MENÜ --- */
        #home {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        .header-titles {
            text-align: left;
        }

        h1 {
            color: var(--pubg-yellow);
            font-size: 1.8rem;
            margin: 0 0 5px 0;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p {
            color: #888;
            margin: 0;
            font-size: 1rem;
        }

        .google-btn {
            display: inline-block;
            background-color: transparent;
            color: #ccc;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 1rem;
            border: 1px solid #444;
            transition: all 0.3s ease;
        }

        .google-btn:hover {
            background-color: var(--card-bg);
            color: var(--pubg-yellow);
            border-color: var(--pubg-yellow);
        }

        /* --- HARİTA KARTLARI --- */
        .map-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .map-card {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .map-card:hover {
            transform: translateY(-4px);
            border-color: var(--pubg-yellow);
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
        }

        .map-thumb {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid #333;
            background-color: #000;
        }

        .map-card h2 {
            margin: 0;
            padding: 15px;
            font-size: 1.2rem;
            color: #ddd;
            text-align: center;
            letter-spacing: 1px;
        }

        /* --- TAM EKRAN HARİTA GÖRÜNTÜLEYİCİ --- */
        #map-view {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #050505;
            z-index: 100;
            overflow: hidden;
        }

        /* YENİ: Harita İçi Üst Menü (Header) */
        .map-view-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 200;
        }

        .back-btn {
            background-color: transparent;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 16px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .back-btn:hover {
            background-color: #c0392b;
            border-color: #e74c3c;
        }

        /* YENİ: Harita Kısayolları */
        .map-shortcuts {
            display: flex;
            gap: 20px;
            margin-left: 30px;
            overflow-x: auto;
            white-space: nowrap;
            /* Scrollbar'ı gizlemek için */
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }
        
        .map-shortcuts::-webkit-scrollbar {
            display: none;
        }

        .shortcut-item {
            color: #aaa;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .shortcut-item:hover, .shortcut-item.active {
            color: var(--pubg-yellow);
        }

        /* --- SÜRÜKLEME VE ZOOM ALANI --- */
        #map-container {
            width: 100%; 
            /* Yükseklik artık header'dan arta kalan alan kadar */
            height: calc(100vh - 60px); 
            margin-top: 60px;
            cursor: grab;
            position: relative;
        }

        #map-container:active {
            cursor: grabbing;
        }

        #zoom-container {
            transform-origin: 0 0;
            position: absolute;
            top: 0; left: 0;
            will-change: transform;
        }

        #map-image {
            display: block;
            pointer-events: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

    <!-- 1. ANA MENÜ -->
    <div id="home">
        <div class="top-header">
            <div class="header-titles">
                <h1>PUBG Harita Arşivi</h1>
                <p>İncelemek istediğiniz haritayı seçin.</p>
            </div>
            <a href="https://www.google.com.tr" target="_blank" class="google-btn">🌐 Google'da Ara</a>
        </div>
        
        <div class="map-grid" id="map-grid"></div>
    </div>

    <!-- 2. HARİTA GÖRÜNTÜLEYİCİ -->
    <div id="map-view">
        <div class="map-view-header">
            <button class="back-btn" onclick="closeMap()">🔙 Geri Dön</button>
            <div class="map-shortcuts" id="map-shortcuts">
                <!-- Javascript ile buraya kısayollar eklenecek -->
            </div>
        </div>

        <div id="map-container">
            <div id="zoom-container">
                <img id="map-image" src="" alt="Harita" draggable="false">
            </div>
        </div>
    </div>

    <!-- 3. JAVASCRIPT MOTORU -->
    <script>
        const maps = [
            { id: 'erangel', name: 'Erangel', src: 'erangel.jpg' },
            { id: 'miramar', name: 'Miramar', src: 'miramar.jpg' },
            { id: 'taego', name: 'Taego', src: 'taego.jpg' },
            { id: 'rondo', name: 'Rondo', src: 'rondo.jpg' },
            { id: 'vikendi', name: 'Vikendi', src: 'vikendi.jpg' },
            { id: 'sanhok', name: 'Sanhok', src: 'sanhok.jpg' },
            { id: 'deston', name: 'Deston', src: 'deston.jpg' },
            { id: 'paramo', name: 'Paramo', src: 'paramo.jpg' },
            { id: 'karakin', name: 'Karakin', src: 'karakin.jpg' }
        ];

        // Grid Kartlarını ve Üst Menü Kısayollarını Oluştur
        const grid = document.getElementById('map-grid');
        const shortcutsContainer = document.getElementById('map-shortcuts');

        maps.forEach(map => {
            // 1. Ana sayfadaki grid kartları
            const card = document.createElement('div');
            card.className = 'map-card';
            card.onclick = () => openMap(map.src, map.id);
            card.innerHTML = `
                <img class="map-thumb" src="${map.src}" alt="${map.name} Haritası" onerror="this.style.display='none'">
                <h2>${map.name}</h2>
            `;
            grid.appendChild(card);

            // 2. Harita içindeki üst menü kısayolları
            const shortcut = document.createElement('span');
            shortcut.className = 'shortcut-item';
            shortcut.innerText = map.name;
            shortcut.id = `shortcut-${map.id}`;
            shortcut.onclick = () => openMap(map.src, map.id);
            shortcutsContainer.appendChild(shortcut);
        });

        // Zoom, Pan ve Sınır Değişkenleri
        let scale = 1;
        let minScale = 0.1; 
        let pointX = 0, pointY = 0;
        let isPanning = false;
        let startX = 0, startY = 0;

        const mapContainer = document.getElementById('map-container');
        const zoomContainer = document.getElementById('zoom-container');
        const mapImage = document.getElementById('map-image');

        function setTransform() {
            zoomContainer.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        // Haritayı aç, resmi yükle ve üst menüdeki seçili metni sarı yap
        function openMap(imgSrc, mapId) {
            document.getElementById('home').style.display = 'none';
            document.getElementById('map-view').style.display = 'block';
            
            // Kısayollardaki "active" (sarı renk) sınıfını güncelle
            document.querySelectorAll('.shortcut-item').forEach(el => el.classList.remove('active'));
            if(mapId) {
                document.getElementById(`shortcut-${mapId}`).classList.add('active');
            }

            mapImage.src = imgSrc;

            mapImage.onload = () => {
                const cw = mapContainer.clientWidth;
                const ch = mapContainer.clientHeight;
                const iw = mapImage.naturalWidth || 1000;
                const ih = mapImage.naturalHeight || 1000;

                minScale = Math.min(cw / iw, ch / ih); 
                scale = minScale; 
                
                pointX = (cw - (iw * scale)) / 2;
                pointY = (ch - (ih * scale)) / 2;
                setTransform();
            };
        }

        function closeMap() {
            document.getElementById('home').style.display = 'block';
            document.getElementById('map-view').style.display = 'none';
            mapImage.src = ''; 
        }

        // --- MOUSE SÜRÜKLEME VE ZOOM ---
        mapContainer.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; 
            e.preventDefault();
            startX = e.clientX - pointX;
            startY = (e.clientY - 60) - pointY; // Header yüksekliğini çıkarıyoruz
            isPanning = true;
        });

        window.addEventListener('mouseup', () => { isPanning = false; });
        window.addEventListener('mouseleave', () => { isPanning = false; });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            e.preventDefault();
            pointX = e.clientX - startX;
            pointY = (e.clientY - 60) - startY;
            setTransform();
        });

        mapContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            
            const rect = mapContainer.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const xs = (mouseX - pointX) / scale;
            const ys = (mouseY - pointY) / scale;
            
            const delta = e.deltaY > 0 ? (1 / 1.15) : 1.15;
            let newScale = scale * delta;
            
            if (newScale <= minScale) {
                newScale = minScale;
                
                const cw = mapContainer.clientWidth;
                const ch = mapContainer.clientHeight;
                const iw = mapImage.naturalWidth || 1000;
                const ih = mapImage.naturalHeight || 1000;
                
                pointX = (cw - (iw * newScale)) / 2;
                pointY = (ch - (ih * newScale)) / 2;
            } else {
                if (newScale > 20) newScale = 20; 
                pointX = mouseX - xs * newScale;
                pointY = mouseY - ys * newScale;
            }
            
            scale = newScale;
            setTransform();
        }, { passive: false });

        window.addEventListener('resize', () => {
            if (document.getElementById('map-view').style.display === 'block') {
                const cw = mapContainer.clientWidth;
                const ch = mapContainer.clientHeight;
                const iw = mapImage.naturalWidth || 1000;
                const ih = mapImage.naturalHeight || 1000;
                minScale = Math.min(cw / iw, ch / ih);
                if (scale < minScale) {
                    scale = minScale;
                    pointX = (cw - (iw * scale)) / 2;
                    pointY = (ch - (ih * scale)) / 2;
                    setTransform();
                }
            }
        });
    </script>
</body>
</html>
